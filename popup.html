<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMAPS</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --surface: #fff;
      --surface-soft: #f5f8fc;
      --text: #17212f;
      --muted: #66758a;
      --accent: #2563eb;
      --line: #e4eaf2;
      --select-bg: #fff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1c2430;
        --surface-soft: #252f3d;
        --text: #edf3fb;
        --muted: #a9b7c9;
        --accent: #8ab4ff;
        --line: #354252;
        --select-bg: #202a37;
      }
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      background: var(--surface);
      color: var(--text);
    }

    .panel { padding: 20px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex: none;
    }

    h1 {
      margin: 0 0 3px;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: .01em;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .intro {
      margin: 0 0 18px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .setting-label {
      display: block;
      margin: 0 0 7px;
      font-size: 12px;
      font-weight: 650;
    }

    select {
      width: 100%;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--select-bg);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    select:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .footer a {
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }
    .version { color: var(--muted); font-size: 11px; }

    .other-extensions { margin-top: 18px; }
    .other-extensions-heading { margin: 0 0 9px; }
    .other-extensions-heading h2 { margin: 0 0 3px; font-size: 13px; line-height: 1.3; }
    .other-extensions-heading p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .extension-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-soft);
      color: var(--text);
      text-decoration: none;
    }
    .extension-card:hover { border-color: var(--accent); }
    .extension-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .extension-card img { width: 38px; height: 38px; flex: none; object-fit: contain; }
    .extension-card-copy { min-width: 0; flex: 1; }
    .extension-card-copy strong { display: block; margin-bottom: 3px; font-size: 12px; line-height: 1.3; }
    .extension-card-copy span { display: block; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .extension-card-action { color: var(--accent); font-size: 10px; font-weight: 650; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="panel">
    <header class="brand">
      <img class="brand-icon" src="128.png" alt="" aria-hidden="true">
      <div>
        <h1>GMAPS</h1>
        <p class="tagline" data-i18n="tagline">Google Maps shortcut</p>
      </div>
    </header>

    <p class="intro" data-i18n="description">Search the current phrase in Google Maps directly from Google results.</p>

    <section aria-labelledby="language-label">
      <label class="setting-label" id="language-label" for="language" data-i18n="languageLabel">Language</label>
      <select id="language">
        <option value="auto" data-i18n="autoOption">Automatic (browser language)</option>
        <option value="en">English</option>
        <option value="pl">Polski</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="ja">日本語</option>
        <option value="zh_CN">简体中文</option>
      </select>
    </section>

    <section class="other-extensions" aria-labelledby="other-extensions-title">
      <div class="other-extensions-heading">
        <h2 id="other-extensions-title" data-i18n="otherExtensionsTitle">More of my extensions</h2>
        <p data-i18n="otherExtensionsDescription">Discover my other browser tools.</p>
      </div>
      <a class="extension-card" href="https://chromewebstore.google.com/detail/timespeak-%E2%80%93-speaking-time/ldccnfkgjhgjdcmahlfpgiohoihglckc?authuser=0&amp;hl=pl" target="_blank" rel="noopener noreferrer">
        <img src="timespeak-icon.png" alt="" aria-hidden="true">
        <span class="extension-card-copy">
          <strong>TimeSpeak</strong>
          <span data-i18n="timeSpeakDescription">Speaking time tracker for Google Meet.</span>
        </span>
        <span class="extension-card-action" data-i18n="chromeStoreLink">Chrome Web Store ↗</span>
      </a>
    </section>

    <footer class="footer">
      <a href="https://buymeacoffee.com/kfheigeld" target="_blank" rel="noopener noreferrer" data-i18n="supportLink">Support the project</a>
      <a href="https://github.com/kfheigel/gmaps" target="_blank" rel="noopener noreferrer" data-i18n="githubLink">GitHub</a>
      <span class="version" id="version"></span>
    </footer>
  </main>
  <script src="popup.js" defer></script>
</body>
</html>
